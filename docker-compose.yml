services:
  whisper:
    image: voicecoder-whisper:latest
    build:
      context: .
      dockerfile: Dockerfile.whisper
    restart: unless-stopped
    environment:
      PARAKEET_MODEL: ${PARAKEET_MODEL:-sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8}
      PARAKEET_PROVIDER: ${PARAKEET_PROVIDER:-cpu}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-8}
      WHISPER_DOWNLOAD_ROOT: /models
    ports:
      - "${WHISPER_PUBLISH:-8080:8080}"
    volumes:
      - whisper-models:/models
    healthcheck:
      # Liveness only — model load happens in the background after listen.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # BRIDGE_AGENT=agentapi sends cleaned requests to the agent service. The
  # default, none, only transcribes.
  bridge:
    image: voicecoder-bridge:latest
    build: .
    restart: unless-stopped
    command: >-
      --addr :8000 --whisper-url http://whisper:8080
      --agent ${BRIDGE_AGENT:-none} --agentapi-url http://agent:3284
      --repo /home/coder/project
    environment:
      BRIDGE_ALLOWED_ORIGINS: ${BRIDGE_ALLOWED_ORIGINS:-}
      # Optional spoken end word (also --end-word). Empty keeps silence-only ending.
      BRIDGE_END_WORD: ${BRIDGE_END_WORD:-}
      # Reads agent summaries aloud. Empty leaves speech off.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-}
      # Lets the bridge narrate the agent and answer the user while it works,
      # with short Claude calls of its own. BRIDGE_TALK=off turns that off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      BRIDGE_TALK: ${BRIDGE_TALK:-}
      # Welcome spoken once after the first request. "off" turns it off.
      BRIDGE_INTRO: ${BRIDGE_INTRO:-}
    ports:
      - "${BRIDGE_PUBLISH:-8000:8000}"
    volumes:
      - agent-home:/home/coder
    depends_on:
      whisper:
        condition: service_healthy

  # Claude Code behind AgentAPI. It idles unless ANTHROPIC_API_KEY is set.
  agent:
    image: voicecoder-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    init: true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      - agent-home:/home/coder

  model-download:
    profiles:
      - setup
    image: voicecoder-whisper:latest
    build:
      context: .
      dockerfile: Dockerfile.whisper
    entrypoint: ["python3", "/app/download_model.py"]
    environment:
      PARAKEET_MODEL: ${PARAKEET_MODEL:-sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8}
      WHISPER_DOWNLOAD_ROOT: /models
    volumes:
      - whisper-models:/models

volumes:
  # Shared across all Coder workspaces on the host so Parakeet is downloaded once.
  whisper-models:
    name: voicecoder-whisper-models
  # The home folder the agent works in. In a Coder workspace this is the
  # workspace's own home volume, so the editor shows the same project.
  agent-home:
    name: ${VC_HOME_VOLUME:-voicecoder-agent-home}
    external: ${VC_HOME_EXTERNAL:-false}
