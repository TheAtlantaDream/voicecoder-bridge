services:
  whisper:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    command: --host 0.0.0.0 -m /models/ggml-small.en.bin --port 8080 -t 8
    ports:
      - "8080:8080"
    volumes:
      - whisper-models:/models

  bridge:
    build: .
    command: --addr :8000 --whisper-url http://whisper:8080
    ports:
      - "8000:8000"
    depends_on:
      - whisper

  model-download:
    profiles:
      - setup
    build:
      context: .
      dockerfile: Dockerfile.whisper
    entrypoint: /opt/whisper-models/download-ggml-model.sh
    command: small.en /models
    volumes:
      - whisper-models:/models

volumes:
  whisper-models:
